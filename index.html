<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernwelt</title>
<link rel="icon" href="uhr-lesen/icon.svg" type="image/svg+xml">
<style>
  :root {
    --ground: #eef5f1; --card: #ffffff; --ink: #22314a; --muted: #5b6b7e; --line: #d3e0da; --focus: #2a64c8;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { color-scheme: dark; --ground: #152130; --card: #1f2d40; --ink: #eaf1f7; --muted: #a8b6c6; --line: #33455c; --focus: #7fb0ff; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ground); color: var(--ink); }
  main { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 32px; display: flex; flex-direction: column; gap: 20px; }
  h1 { margin: 0; font-size: clamp(2.2rem, 7vw, 3rem); }
  p { margin: 0; color: var(--muted); }
  .apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .app {
    display: flex; gap: 14px; align-items: center; padding: 16px;
    background: var(--card); border: 3px solid var(--line); border-radius: 18px;
    color: inherit; text-decoration: none;
  }
  .app:hover { border-color: var(--focus); }
  .app:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .app img { width: 64px; height: 64px; flex: none; }
  .app strong { display: block; font-size: 1.3rem; }
  .app span { color: var(--muted); font-size: .95rem; }
</style>
</head>
<body>
<main>
  <h1>Lernwelt</h1>
  <p>Kleine Lern-Apps für Kinder. Ohne Werbung, ohne Konto, auch offline.</p>
  <nav class="apps" aria-label="Apps">
    <a class="app" href="launcher/">
      <img src="launcher/icons/icon.svg" alt="">
      <div><strong>Lernwelt</strong><span>Alle Apps an einem Ort</span></div>
    </a>
    <a class="app" href="uhr-lesen/">
      <img src="uhr-lesen/icon.svg" alt="">
      <div><strong>Uhr lesen</strong><span>Die Uhr lesen üben</span></div>
    </a>
    <a class="app" href="einmaleins/">
      <img src="einmaleins/icon.svg" alt="">
      <div><strong>Einmaleins</strong><span>Das kleine Einmaleins üben</span></div>
    </a>
  </nav>
</main>
</body>
</html>
